const balance=()=>earned+tips+gifted-demerits-paid;
const available=()=>balance()-held();

w.innerHTML='<div class="section-head"><h2>My chore journal</h2></div><div class="filters">'+[['all','Today'],['pending','In review'],['approved','Approved']].map(f=>'<button data-filter="'+f[0]+'" class="'+(filter===f[0]?'active':'')+'">'+f[1]+'</button>').join('')+'</div>'+shown.slice().sort((a,b)=>b.id-a.id).map(c=>'<article class="chore" data-detail="'+c.id+'" tabindex="0" role="button" aria-label="View '+esc(c.name)+'"><div class="chore-icon">'+svg(c.icon)+'</div><div class="chore-info"><h3>'+esc(c.name)+'</h3><span class="status '+(c.status==='approved'?'done':'')+'">'+(c.status==='approved'?'Approved · +'+money(c.reward):c.status==='redo'?'New photo needed':'In review · $0.50 base')+'</span><p>'+(c.status==='approved'?'Confirmed by '+esc(c.by):c.status==='redo'?'Your admin asked for a fresh photo.':'Waiting for Admin One or Admin Two')+'</p></div>'+icon('chevron')+(c.status==='redo'?'<button class="action" data-resubmit="'+c.id+'">Send a new photo</button>':'')+'</article>').join('')+(!shown.length?'<p class="empty">No chores here yet. Add one when you finish helping.</p>':'');$$('[data-detail]').forEach(b=>{b.onclick=()=>viewChore(+b.dataset.detail);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();viewChore(+b.dataset.detail);}};});$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});$$('[data-resubmit]').forEach(b=>b.onclick=e=>{e.stopPropagation();submitChore(+b.dataset.resubmit)});}
function viewChore(id){const c=chores.find(c=>c.id===id);if(!c)return;show('<h2>'+esc(c.name)+'</h2>'+(c.photo?'<img class="detail-photo" src="'+c.photo+'" alt="Your submitted chore photo">':'<div class="detail-art">'+svg(c.icon)+'</div>')+'<p>'+(c.status==='approved'?'Confirmed by '+esc(c.by)+' · '+esc(c.rating):c.status==='redo'?'Please send a fresh photo.':'In review. Admin One or Admin Two will confirm the quality and any tip.')+'</p>'+(c.status==='approved'?'<div class="rule"><span>Basic chore</span><strong>$0.50</strong></div><div class="rule"><span>Admin tip</span><strong>'+money(c.reward-50)+'</strong></div><div class="total-preview">Final reward: '+money(c.reward)+'</div>':'<p>Base reward: $0.50 · Not added to your balance yet.</p>')+(c.note?'<p>'+esc(c.note)+'</p>':'')+'<div class="dialog-actions"><button class="action" id="cancel">Close</button></div>');}
function renderReviews(w){const pending=chores.filter(c=>c.status==='pending');w.innerHTML='<div class="section-head"><h2>Chore reviews</h2><span class="tag">'+pending.length+' waiting</span></div><label class="small">Reviewing as<select id="reviewer"><option>Admin One</option><option>Admin Two</option></select></label><div style="height:18px"></div>'+pending.map(c=>'<article class="review"><div class="review-layout"><div class="example-photo">'+(c.photo?'<img src="'+c.photo+'" alt="Submitted chore photo">':svg(c.icon)+'<small>Example photo placeholder</small>')+'</div><div><h3>'+esc(c.name)+'</h3><div class="small">Player 1 · Base reward $0.50'+(c.note?'<br>'+esc(c.note):'')+'</div><div class="review-controls"><label>QUALITY<select id="quality-'+c.id+'"><option value="well">Done really well</option><option value="basic">Meets the basics</option></select></label><label>ADMIN TIP ($)<input id="tip-'+c.id+'" type="text" inputmode="decimal" value="0.00" autocomplete="off"></label></div><div class="total-preview" id="total-'+c.id+'">Final reward: $0.50</div><div class="review-actions"><button class="action primary" data-approve="'+c.id+'">Review & confirm total</button><button class="action" data-redo="'+c.id+'">Ask for a new photo</button></div></div></div></article>').join('')+(!pending.length?'<p class="empty">All caught up. Submitted chores will appear here.</p>':'')+'<button class="action" id="demerit">Record a demerit</button><p class="small">Cash and purchase requests are under Coins.</p>';$('#reviewer').value=reviewer;$('#reviewer').onchange=e=>reviewer=e.target.value;pending.forEach(c=>{$('#tip-'+c.id).oninput=()=>{const tip=cents($('#tip-'+c.id).value);$('#total-'+c.id).textContent=tip===null?'Enter a valid tip amount.':'Final reward: '+money(50+tip);};});$$('[data-approve]').forEach(b=>b.onclick=()=>confirmReward(+b.dataset.approve));$$('[data-redo]').forEach(b=>b.onclick=()=>{chores.find(c=>c.id===+b.dataset.redo).status='redo';render();toast('A new photo has been requested.');});$('#demerit').onclick=demerit;}
function submitChore(id){const existing=chores.find(c=>c.id===id);show('<h2>'+(existing?'Send a new photo':'What did you help with?')+'</h2><p>Basic reward: $0.50. Your admin sets any tip after checking your work.</p>'+(existing?'<p>'+esc(existing.name)+'</p>':'<label>Chore<select id="choreType">'+basicChores.map(c=>'<option>'+esc(c)+'</option>').join('')+'<option value="other">Another chore…</option></select></label><label id="customWrap" class="hidden">Chore name<input id="customName" type="text" maxlength="80" placeholder="What did you do?"></label>')+'<label>Photo<input type="file" id="photo" accept="image/*" capture="environment"></label><label>Anything to tell your admin? (optional)<input id="choreNote" type="text" maxlength="200" placeholder="A short note"></label><p class="small">Photos stay in this local preview.</p><div class="dialog-actions"><button class="action" id="cancel">Cancel</button><button class="action primary" id="send">Send for review</button></div>');if(!existing)$('#choreType').onchange=()=>$('#customWrap').classList.toggle('hidden',$('#choreType').value!=='other');$('#send').onclick=()=>{const name=existing?existing.name:$('#choreType').value==='other'?$('#customName').value.trim():$('#choreType').value;const f=$('#photo').files[0];if(!name){toast('Enter the chore name.');return;}if(!f||!f.type.startsWith('image/')||f.size>10*1024*1024){toast('Add an image smaller than 10 MB.');return;}const url=URL.createObjectURL(f);photoURLs.push(url);const c=existing||{id:nextId++,name,icon:name==='Make the bed'?'bed':name==='Clean the table'||name==='Wash dishes'?'table':'toys'};c.photo=url;c.note=$('#choreNote').value.trim();c.status='pending';if(!existing)chores.unshift(c);close();filter='pending';render();document.dispatchEvent(new CustomEvent('buddy:celebrate',{detail:{kind:'submitted'}}));toast('Chore sent for review. Reward is not finalized yet.');};}
function confirmReward(id){if(!adult)return;const c=chores.find(c=>c.id===id);if(!c||c.status!=='pending')return;const tip=cents($('#tip-'+id).value);if(tip===null){toast('Enter a valid tip, such as 0.25.');return;}const well=$('#quality-'+id).value==='well';const by=reviewer;show('<h2>Confirm the final reward</h2><p>'+esc(c.name)+' · '+(well?'Done really well':'Meets the basics')+'</p><div class="rule"><span>Basic chore</span><strong>$0.50</strong></div><div class="rule"><span>Your tip</span><strong>'+money(tip)+'</strong></div><div class="rule"><strong>Total to add</strong><strong>'+money(50+tip)+'</strong></div><p>Confirmed by '+esc(by)+'. Coins are added only after this confirmation.</p><div class="dialog-actions"><button class="action" id="cancel">Go back</button><button class="action primary" id="confirm">Confirm '+money(50+tip)+'</button></div>');$('#confirm').onclick=()=>{if(!adult||c.status!=='pending'){close();return;}c.status='approved';c.reward=50+tip;c.rating=well?'Done really well':'Meets the basics';c.by=by;earned+=50;tips+=tip;count++;if(well)quality++;ledger.unshift({name:c.name,note:by+' confirmed · $0.50 chore + '+money(tip)+' tip',amount:50+tip});close();render();document.dispatchEvent(new CustomEvent('buddy:celebrate',{detail:{kind:'approved'}}));rewardMotion(50+tip);toast(money(50+tip)+' finalized by '+by+'.');};}
function renderFunds(w){w.innerHTML=(!adult?'<div class="fund-actions"><button class="action primary" id="cashRequest">Get cash</button><button class="action" id="buyRequest">Buy something</button></div><p class="small">Requests reserve your coins. Admin One or Admin Two will hand over cash or buy the item for you.</p>':'<p class="small">Confirm only after giving the cash or buying the item. Declining a request releases the reserved coins.</p>')+'<div class="section-head"><h2>'+(adult?'Money requests':'My requests')+'</h2><span class="tag">'+requests.filter(r=>r.status==='pending').length+' waiting</span></div>'+requests.map(r=>'<article class="request"><div class="section-head"><h3>'+(r.kind==='cash'?'Cash withdrawal':esc(r.item))+'</h3><strong>'+money(r.amount)+'</strong></div><p class="small">'+(r.kind==='cash'?'Receive physical cash':'Purchase by an admin')+' · '+(r.status==='pending'?'Reserved · Waiting for admin':r.status==='completed'?esc(r.by)+' confirmed completion':r.status==='declined'?'Declined · Coins returned':'Cancelled · Coins returned')+'</p>'+(r.status==='pending'?adult?'<div class="review-actions"><button class="action primary" data-complete="'+r.id+'">'+(r.kind==='cash'?'Confirm cash handed over':'Confirm item purchased')+'</button><button class="action" data-decline="'+r.id+'">Decline & return coins</button></div>':'<button class="action" data-cancel="'+r.id+'">Cancel & return coins</button>':'')+'</article>').join('')+(!requests.length?'<p class="empty">No cash or purchase requests yet.</p>':'')+'<h2 style="margin-top:24px">Coin activity</h2>'+ledger.map(l=>'<div class="ledger-row"><div>'+esc(l.name)+'<small>'+esc(l.note)+'</small></div><strong class="'+(l.amount>0?'positive':'negative')+'">'+(l.amount>0?'+':'−')+money(Math.abs(l.amount))+'</strong></div>').join('');if(!adult){$('#cashRequest').onclick=()=>requestMoney('cash');$('#buyRequest').onclick=()=>requestMoney('buy');}$$('[data-complete]').forEach(b=>b.onclick=()=>completeRequest(+b.dataset.complete));$$('[data-decline]').forEach(b=>b.onclick=()=>releaseRequest(+b.dataset.decline,'declined'));$$('[data-cancel]').forEach(b=>b.onclick=()=>releaseRequest(+b.dataset.cancel,'cancelled'));if(typeof renderGiftTopup==='function')renderGiftTopup(w);}
function requestMoney(kind){show('<h2>'+(kind==='cash'?'Get physical cash':'Buy something')+'</h2><p>Available: '+money(available())+'. The requested amount is reserved immediately.</p>'+(kind==='buy'?'<label>What would you like?<input id="item" type="text" maxlength="120" placeholder="Item name"></label>':'')+'<label>Amount ($)<input id="amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></label><div class="dialog-actions"><button class="action" id="cancel">Cancel</button><button class="action primary" id="confirm">Send request</button></div>');$('#confirm').onclick=()=>{const n=cents($('#amount').value);const item=kind==='buy'?$('#item').value.trim():'';if(n===null||n<=0){toast('Enter an amount greater than zero.');return;}if(n>available()){toast('That is more than your available coins.');return;}if(kind==='buy'&&!item){toast('Enter what you would like to buy.');return;}requests.unshift({id:nextId++,kind,item,amount:n,status:'pending'});close();render();toast(money(n)+' reserved. Your admin will review the request.');};}
function releaseRequest(id,status){const r=requests.find(r=>r.id===id);if(!r||r.status!=='pending'||(status==='declined'&&!adult))return;r.status=status;render();toast(money(r.amount)+' returned to available funds.');}
function completeRequest(id){if(!adult)return;const r=requests.find(r=>r.id===id);if(!r||r.status!=='pending')return;if(balance()<held()){toast('Balance changed. Release or adjust requests before completing them.');return;}show('<h2>'+(r.kind==='cash'?'Cash handed over?':'Item purchased?')+'</h2><p>'+money(r.amount)+' · '+esc(r.kind==='cash'?'Physical cash':r.item)+'. Confirm only after fulfilling this request.</p><label>Confirmed by<select id="fulfilledBy"><option>Admin One</option><option>Admin Two</option></select></label><div class="dialog-actions"><button class="action" id="cancel">Go back</button><button class="action primary" id="confirm">Confirm completion</button></div>');$('#fulfilledBy').value=reviewer;$('#confirm').onclick=()=>{if(!adult||r.status!=='pending'){close();return;}r.status='completed';r.by=$('#fulfilledBy').value;paid+=r.amount;ledger.unshift({name:r.kind==='cash'?'Cash withdrawn':'Purchased: '+r.item,note:r.by+' confirmed · '+(r.kind==='cash'?'Cash handed over':'Item purchased'),amount:-r.amount});close();render();toast('Completed. The reserved amount is now recorded as spent.');};}
function demerit(){if(!adult)return;show('<h2>Record a demerit</h2><label>Recorded by<select id="recorded"><option>Admin One</option><option>Admin Two</option></select></label><label>What happened?<select id="reason"><option value="50">Misbehavior · −$0.50</option><option value="100">Stomping · −$1.00</option><option value="100">iPad before 11am · −$1.00</option>'+(typeof familyRules!=='undefined'?familyRules.filter(r=>r.deduction>0).map(r=>'<option value="'+r.deduction+'">'+esc(r.name)+' · −'+money(r.deduction)+'</option>').join(''):'')+'</select></label><div class="dialog-actions"><button class="action" id="cancel">Cancel</button><button class="action primary" id="confirm">Confirm deduction</button></div>');$('#recorded').value=reviewer;$('#confirm').onclick=()=>{if(!adult)return;const s=$('#reason'),n=+s.value;demerits+=n;ledger.unshift({name:s.selectedOptions[0].textContent.split(' · ')[0],note:'Recorded by '+$('#recorded').value,amount:-n});close();render();toast(money(n)+' demerit recorded.');};}
// Local motion only: no dependencies, sound, vibration or network calls.
const motionPreference=typeof matchMedia==='function'?matchMedia('(prefers-reduced-motion: reduce)'):null;
const reduceMotion=()=>!!motionPreference?.matches;
const springFrames=(distance=16)=>Array.from({length:25},(_,i)=>{
  const t=i/24,omega=9,settle=1-(1+omega)*Math.exp(-omega);
  const progress=(1-(1+omega*t)*Math.exp(-omega*t))/settle;
  return {transform:'translateY('+(distance*(1-progress))+'px)',opacity:Math.min(1,t*5),offset:t};
});
function animateElement(el,frames,options={}){
  if(!el?.animate)return null;
  el.getAnimations?.().forEach(a=>a.cancel());
  const animation=el.animate(reduceMotion()?[{opacity:.75},{opacity:1}]:frames,{duration:330,easing:'linear',...options,...(reduceMotion()?{duration:100,delay:0}:{})});
  animation.onfinish=()=>animation.cancel();
  return animation;
}
let previousScreen=null;
function animateWorkspace(){previousScreen=page+':'+adult+':'+filter;}
let balanceFrame=0,displayedCents=null;
function animateBalance(target){
  const el=$('#balance');
  if(typeof requestAnimationFrame!=='function'||reduceMotion()||displayedCents===null){
    if(typeof cancelAnimationFrame==='function')cancelAnimationFrame(balanceFrame);
    displayedCents=target;el.textContent=money(target);el.setAttribute?.('aria-label','Available funds '+money(target));return;
  }
  cancelAnimationFrame(balanceFrame);
  const from=displayedCents,start=performance.now();
  el.setAttribute('aria-label','Available funds '+money(target));
  if(from===target){el.textContent=money(target);return;}
  function tick(now){const t=Math.min(1,(now-start)/360),w=8,p=(1-(1+w*t)*Math.exp(-w*t))/(1-(1+w)*Math.exp(-w));displayedCents=Math.round(from+(target-from)*p);el.textContent=money(displayedCents);if(t<1)balanceFrame=requestAnimationFrame(tick);else{displayedCents=target;el.textContent=money(target);}}
  balanceFrame=requestAnimationFrame(tick);
}
let sheetAnimation=null,sheetGeneration=0,sheetClosing=false;
function sheetPosition(){
  if(!modal.open||typeof getComputedStyle!=='function')return {y:32,opacity:0};
  const style=getComputedStyle(modal);
  const y=typeof DOMMatrixReadOnly==='function'&&style.transform!=='none'?new DOMMatrixReadOnly(style.transform).m42:0;
  return {y,opacity:Number(style.opacity)};
}
function openSheet(){sheetClosing=false;if(!modal.open)modal.showModal();}
function closeSheet(){sheetClosing=false;modal.close();}
function rewardMotion(amount){
  const wallet=$('.wallet');
  animateElement(wallet,reduceMotion()?[{opacity:.8},{opacity:1}]:[{transform:'scale(1)'},{transform:'scale(1.015)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
  if(reduceMotion()||!wallet?.append)return;
  const label=document.createElement('span');label.className='coin-gain';label.textContent='+'+money(amount);label.setAttribute('aria-hidden','true');wallet.append(label);
  const a=label.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)',offset:.2},{opacity:0,transform:'translateY(-24px)'}],{duration:900,easing:'ease-out'});a.onfinish=()=>label.remove();
  for(let i=0;i<3;i++){const coin=document.createElement('img');coin.src='assets/coin.png';coin.className='pixel-spark';coin.setAttribute('aria-hidden','true');wallet.append(coin);const a=coin.animate([{transform:'translate(0,8px) rotate(0)',opacity:0},{opacity:1,offset:.15},{transform:'translate('+((i-1)*27)+'px,-35px) rotate('+(i-1)*35+'deg)',opacity:0}],{duration:650,delay:i*45,easing:'ease-out'});a.onfinish=()=>coin.remove();}
}
if(modal.addEventListener)modal.addEventListener('cancel',e=>{e.preventDefault();closeSheet();});
if(motionPreference?.addEventListener)motionPreference.addEventListener('change',()=>{
  if(!reduceMotion())return;
  cancelAnimationFrame(balanceFrame);sheetAnimation?.cancel();if(sheetClosing){modal.close();sheetClosing=false;}
  $$('main, #workspace, .wallet, .chore, .review, .request, .pixel-spark, .coin-gain, #toast').forEach(el=>el.getAnimations?.().forEach(a=>a.cancel()));
  $$('.pixel-spark, .coin-gain').forEach(el=>el.remove());
  displayedCents=available();$('#balance').textContent=money(displayedCents);
  if(modal.open)modal.style.transform='';
});

$('#addChore').onclick=()=>submitChore();$('#openWallet').onclick=()=>{page='funds';render();};$('#profile').onclick=()=>$('#rolePanel').classList.toggle('hidden');$('#childMode').addEventListener?.('click',()=>$('#rolePanel').classList.add('hidden'));$('#adultMode').addEventListener?.('click',()=>$('#rolePanel').classList.add('hidden'));
